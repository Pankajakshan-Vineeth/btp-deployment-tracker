_schema-version: '3.1'
ID: btp-deployment-tracker
version: 0.1.0
description: Tracking backend for the btp-deploy CLI. Open, no authentication.
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: btp-deployment-tracker-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: btp-deployment-tracker-db

  # Creates and updates the tables in the HDI container, then stops.
  - name: btp-deployment-tracker-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
    requires:
      - name: btp-deployment-tracker-db

resources:
  # HDI container on the subaccount's HANA Cloud instance. Credentials reach the app via VCAP_SERVICES.
  - name: btp-deployment-tracker-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
