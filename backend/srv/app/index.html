<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTP Deployments</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; font-size: 14px; }
  body { margin: 0; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input { flex: 1; min-width: 200px; padding: 6px 8px; font: inherit; }
  button { padding: 6px 12px; font: inherit; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8884; white-space: nowrap; }
  th { position: sticky; top: 0; background: Canvas; }
  .SUCCESS { color: #1a7f37; font-weight: 600; }
  .FAILED { color: #cf222e; font-weight: 600; }
  .STARTED { color: #9a6700; font-weight: 600; }
  pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; max-width: 80ch; }
  #msg { color: #888; }
</style>
</head>
<body>
<h1>BTP Deployments</h1>
<div class="bar">
  <input id="filter" type="search" placeholder="Filter by artifact, org, space, user, branch…" aria-label="Filter">
  <button id="reload">Reload</button>
</div>
<p id="msg">Loading…</p>
<div class="wrap">
<table hidden>
  <thead><tr>
    <th>Started</th><th>Status</th><th>Artifact</th><th>Org / Space</th><th>CF user</th>
    <th>OS user</th><th>Repository</th><th>Branch</th><th>Commit</th><th>Duration</th><th>Exit</th>
  </tr></thead>
  <tbody></tbody>
</table>
</div>
<script>
  const table = document.querySelector('table');
  const tbody = document.querySelector('tbody');
  const msg = document.getElementById('msg');
  const filter = document.getElementById('filter');
  let rows = [];

  const duration = (ms) => {
    if (ms == null) return '';
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
  };

  // Records come from an open API: only ever insert them as text.
  function cell(tr, text, className) {
    const td = tr.insertCell();
    td.textContent = text ?? '';
    if (className) td.className = className;
    return td;
  }

  function render() {
    const q = filter.value.trim().toLowerCase();
    const shown = rows.filter((r) => !q || JSON.stringify(r).toLowerCase().includes(q));
    tbody.replaceChildren();
    for (const r of shown) {
      const tr = tbody.insertRow();
      cell(tr, new Date(r.startedAt).toLocaleString());
      const status = cell(tr, r.status, r.status);
      if (r.errorSummary) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = r.status;
        const pre = document.createElement('pre');
        pre.textContent = r.errorSummary;
        details.append(summary, pre);
        status.replaceChildren(details);
      }
      cell(tr, r.artifactName).title = `SHA-256 ${r.artifactSha256}`;
      cell(tr, `${r.cfOrganization ?? '?'} / ${r.cfSpace ?? '?'}`);
      cell(tr, r.cfUser);
      cell(tr, r.osUsername);
      cell(tr, r.gitRepository);
      cell(tr, r.gitBranch);
      cell(tr, r.gitCommitSha ? r.gitCommitSha.slice(0, 8) + (r.gitDirty ? ' (dirty)' : '') : '').title = r.gitCommitSha ?? '';
      cell(tr, duration(r.durationMs));
      cell(tr, r.exitCode);
    }
    table.hidden = !shown.length;
    msg.textContent = rows.length ? `${shown.length} of ${rows.length} deployments` : 'No deployments recorded yet.';
  }

  async function load() {
    msg.textContent = 'Loading…';
    try {
      // ponytail: newest 500 only; add server-side paging when the history outgrows that.
      const res = await fetch('odata/v4/deployments/Deployments?$orderby=startedAt desc&$top=500');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      rows = (await res.json()).value;
      render();
    } catch (error) {
      table.hidden = true;
      msg.textContent = `Could not load deployments: ${error.message}`;
    }
  }

  filter.addEventListener('input', render);
  document.getElementById('reload').addEventListener('click', load);
  load();
</script>
</body>
</html>
